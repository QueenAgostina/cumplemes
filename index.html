<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Máquina del Tiempo - 8 Meses</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Georgia', serif; background-color: #0d0d0d; color: #f0f0f0;
            user-select: none;
        }

        /* --- TELÓN INICIAL --- */
        .telon-contenedor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; cursor: pointer;
        }
        .izquierdo, .derecho {
            width: 50%; height: 100%; background-color: #7a0010;
            background-image: linear-gradient(to right, #4a000a, #7a0010, #4a000a);
            transition: transform 2s ease-in-out;
        }
        .abrir .izquierdo { transform: translateX(-100%); }
        .abrir .derecho { transform: translateX(100%); }

        /* --- ESTRUCTURA GENERAL DE PANTALLAS --- */
        .pantalla {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 30px;
        }
        .activa { display: flex; }

        /* --- PRESENTACIÓN --- */
        .titulo-viaje { font-size: 2.8rem; margin-bottom: 15px; color: #ffffff; font-weight: bold; }
        .subtitulo-ready { font-size: 1.8rem; color: #b21f1f; margin-bottom: 40px; font-style: italic; }

        /* --- BOTONES GENERALES --- */
        .btn-principal {
            padding: 12px 35px; font-size: 1.4rem; font-weight: bold; cursor: pointer;
            border: none; border-radius: 5px; transition: all 0.3s ease;
            background-color: #b21f1f; color: white; box-shadow: 0 4px 15px rgba(178, 31, 31, 0.4);
        }
        .btn-principal:hover { background-color: #ff4747; transform: translateY(-2px); }

        .btn-continuar {
            position: absolute; bottom: 40px; right: 40px; display: none;
        }

        /* --- TRIVIA CONTENEDOR --- */
        .trivia-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; }
        .pregunta-texto { font-size: 1.8rem; margin-bottom: 40px; line-height: 1.4; color: #fff; font-weight: bold; }
        .opciones-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 550px; }
        .btn-opcion {
            background-color: #141414; color: #f0f0f0; border: 1px solid #333; text-align: center;
            padding: 18px 20px; border-radius: 6px; font-size: 1.15rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-opcion:hover { background-color: #222; border-color: #b21f1f; transform: scale(1.02); }

        /* --- ANIMACIÓN INTERACTIVA DEL SOBRE --- */
        .sobre-pantalla {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center; z-index: 50;
            background: rgba(13, 13, 13, 0.95); cursor: pointer;
            transition: transform 1s ease-in-out, opacity 1s ease-in-out;
        }
        .sobre-pantalla.deslizar-izquierda {
            transform: translateX(-100%); opacity: 0;
        }
        
        .sobre-wrapper {
            position: relative; width: 450px; height: 300px; margin-top: 100px;
        }

        .sobre {
            position: absolute; bottom: 0; width: 100%; height: 220px;
            background-color: #f4f1ea; border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 5;
        }
        .solapa {
            position: absolute; top: 30px; left: 0; width: 0; height: 0;
            border-left: 225px solid transparent; border-right: 225px solid transparent;
            border-top: 120px solid #ece7dc; transform-origin: top;
            transition: transform 0.6s ease-in-out; z-index: 6;
        }
        .sobre-abierto .solapa {
            transform: rotateX(180deg); z-index: 3;
        }
        .sello {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px; background: radial-gradient(#d63031, #7a0010);
            border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 7;
            transition: opacity 0.3s ease;
        }
        .sobre-abierto .sello { opacity: 0; pointer-events: none; }

        .pergamino {
            position: absolute; bottom: 10px; left: 25px; width: 400px; height: 200px;
            background-color: #dfd5c3; border: 2px solid #c3b59f; border-radius: 4px;
            padding: 20px; display: flex; align-items: center; justify-content: center;
            transition: transform 0.8s ease-in-out 0.6s, height 0.8s ease-in-out 0.6s;
            z-index: 4; overflow: hidden;
            box-shadow: inset 0 0 20px #5c4027, 0 4px 10px rgba(0,0,0,0.3);
        }
        .pergamino-texto {
            color: #000000; font-family: 'Courier New', Courier, monospace;
            font-style: italic; font-weight: bold; font-size: 1.15rem; line-height: 1.4;
            text-align: center; transform: rotate(1deg);
        }
        .sobre-abierto .pergamino {
            transform: translateY(-160px); height: 260px;
        }

        /* --- SECCIÓN MÁQUINA DE ESCRIBIR --- */
        .pista-bloque { font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; }
        .maquina-texto {
            font-size: 1.4rem; line-height: 1.6; max-width: 650px; min-height: 120px;
            text-align: center; color: #ffb3b3; font-family: monospace; border-left: 2px solid #b21f1f; padding-left: 10px;
        }

        /* --- FINAL DEL VIAJE --- */
        .corazones-decoracion { font-size: 2.5rem; margin-top: 30px; color: #b21f1f; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="telon-contenedor" id="telon" onclick="abrirTelon()">
        <div class="izquierdo"></div>
        <div class="derecho"></div>
    </div>

    <div class="pantalla activa" id="pantalla-bienvenida">
        <div class="titulo-viaje">Viajemos en el tiempo...</div>
        <div class="subtitulo-ready">Are you ready, beba?</div>
        <button class="btn-principal" onclick="irAPantalla('pantalla-trivia')">¡Andiamo!</button>
    </div>

    <div class="pantalla" id="pantalla-trivia">
        <div class="trivia-container">
            <div class="pregunta-texto" id="txt-pregunta">Cargando pregunta...</div>
            <div class="opciones-container" id="contenedor-opciones"></div>
        </div>
    </div>

    <div class="sobre-pantalla" id="pantalla-sobre" onclick="manejarClickSobre()">
        <div class="sobre-wrapper">
            <div class="solapa" id="sobre-solapa"><div class="sello"></div></div>
            <div class="pergamino"><div class="pergamino-texto" id="txt-piropo"></div></div>
            <div class="sobre"></div>
        </div>
    </div>

    <div class="pantalla" id="pantalla-pista">
        <div class="pista-bloque" id="txt-desbloqueo-titulo"></div>
        <button class="btn-principal" id="btn-pista-trigger" onclick="iniciarEfectoEscritura()"></button>
        <div class="maquina-texto" id="txt-maquina" style="margin-top: 40px;"></div>
        <button class="btn-principal btn-continuar" id="btn-continuar-pista" onclick="avanzarSiguienteMes()">Continuar</button>
    </div>

    <div class="pantalla" id="pantalla-cierre">
        <div class="pregunta-texto" style="font-size: 1.6rem; color: #aaa;">Bueno mi amor Hemos llegado al final</div>
        <div class="pregunta-texto" style="margin-top: 10px; font-size: 2rem;">¿Con las pistas obtenidas, lograste saber a qué hecho histórico hacemos referencia?</div>
        <div class="corazones-decoracion">❤️❤️❤️❤️❤️❤️</div>
        <div class="titulo-viaje" style="color: #ff4747; margin-top: 20px; font-size: 2.5rem;">¡Feliz cumple mes, preciosa! Te quiero mucho</div>
        <div class="corazones-decoracion">❤️❤️❤️❤️❤️❤️</div>
    </div>
    <script>
        const juegoDatos = [
            {
                pregunta: "¿Cuál de estos cambios fundamentales en la vida humana marcó el verdadero inicio de la Revolución Neolítica hace miles de años?",
                opciones: [
                    { texto: "A) El descubrimiento del fuego y la creación de las primeras herramientas de piedra.", correcta: false },
                    { texto: "B) El paso de la vida nómade a la sedentaria gracias al desarrollo de la agricultura.", correcta: true },
                    { texto: "C) La invención de la escritura y el comercio entre las primeras grandes ciudades.", correcta: false }
                ],
                piropo: "Antes de conocerte, mi corazón era nómade, viajaba sin rumbo. Pero con vos descubrí mi Revolución Neolítica... No importa los kilómetros que nos separen hoy, vos sos el único lugar en el mundo donde decido plantarme, echar raíces y construir mi hogar",
                pista: "Bajo el mandato de los herederos de las estrellas, en la gran joya del Mediterráneo, se erigió un templo que no guardaba estatuas de dioses, sino la memoria entera de la humanidad."
            },
            {
                pregunta: "La Gran Pirámide de Giza es la única de las Siete Maravillas del Mundo Antiguo que sigue en pie. ¿A qué famoso faraón de la dinastía IV pertenecía como tumba?",
                opciones: [
                    { texto: "A) Tutankamón", correcta: false },
                    { texto: "B) Keops (Jufu)", correcta: true },
                    { texto: "C) Ramsés II", correcta: false }
                ],
                piropo: "Las pirámides tardaron décadas en construirse para durar toda la eternidad... un poquito parecido a lo que deseo que dure lo que estamos construyendo juntas.",
                pista: "Cada navío que amarraba en sus muelles no entregaba monedas ni especias a las autoridades; sus bodegas eran revisadas en busca de un tesoro transparente, capaz de navegar por el tiempo sin envejecer."
            },
            {
                pregunta: "En 1494, el Tratado de Tordesillas redibujó el mapa del mundo al trazar una línea imaginaria en el océano. ¿Qué dos grandes potencias de la época firmaron este pacto para repartirse las tierras descubiertas?",
                opciones: [
                    { texto: "A) España y Portugal", correcta: true },
                    { texto: "B) Inglaterra y Francia", correcta: false },
                    { texto: "C) España e Inglaterra.", correcta: false }
                ],
                piropo: "No necesito un tratado con el mundo... Me basta con el pacto silencioso que firmamos la primera vez que nos vimos a los ojos, y reafirmamos con cada mirada, risa, beso, abrazo, y al mostrarnos la desnudez de nuestras almas",
                pista: "Voces de mil rincones, traducidas a una sola lengua, reposaban hombro con hombro bajo el mismo techo, tejiendo la mayor red de saberes que el mundo antiguo llegó a contemplar."
            },
            {
                pregunta: "Johannes Gutenberg revolucionó la historia en 1440 con su imprenta de tipos móviles. ¿Cuál fue el primer gran libro que imprimió en masa en su taller de Alemania?",
                opciones: [
                    { texto: "A) Don Quijote de la Mancha", correcta: false },
                    { texto: "B) La Odisea de Homero", correcta: false },
                    { texto: "C) La Biblia (de 42 líneas)", correcta: true }
                ],
                piropo: "Si la Imprenta revolucionó el mundo esparciendo historias, vos revolucionaste el mío esparciendo felicidad. Cada una de tus palabras se queda impresa en mi mente y multiplica mis ganas de escribir una vida entera con vos.",
                pista: "Mentes ilustres de tierras lejanas cruzaban mares solo para caminar por sus pasillos, donde el pensamiento no tenía dueño y la curiosidad era la única ley."
            },
            {
                pregunta: "Cuando la expedición de Cristóbal Colón llegó a América el 12 de octubre de 1492, un marinero pasó a la historia por dar el legendario grito de '¡Tierra a la vista!'. ¿Quién fue?",
                opciones: [
                    { texto: "A) Rodrigo de Triana", correcta: true },
                    { texto: "B) Américo Vespucio", correcta: false },
                    { texto: "C) Vicente Yáñez Pinzón", correcta: false }
                ],
                piropo: "Sos el descubrimiento que no esperaba encontrar, un mundo nuevo y hermoso que planeo habitar y a tu lado perfeccionar",
                pista: "Allí, la luz de la razón brillaba con la fuerza de un faro, desafiando a las sombras del olvido hasta convertirse en el corazón palpitante de toda una era."
            },
            {
                pregunta: "El 25 de mayo de 1810 se formó la Primera Junta en Buenos Aires tras destituir al virrey Cisneros. ¿Quién fue elegido como el presidente de este primer gobierno patrio?",
                opciones: [
                    { texto: "A) Mariano Moreno", correcta: false },
                    { texto: "B) Cornelio Saavedra", correcta: true },
                    { texto: "C) Juan José Paso", correcta: false }
                ],
                piropo: "Nuestro amor es como la Revolución de Mayo... el nacimiento de algo completamente libre, puro y nuestro. Con vos elegí mi propio destino y te entregué la independencia de mi corazón",
                pista: "Pero la ambición y los conflictos del fuego humano rondaron sus puertas, cuando el metal y las llamas de la guerra cercaron las costas de la gran metrópoli."
            },
            {
                pregunta: "Para que hoy podamos hablar a la distancia por WhatsApp, la ciencia tuvo que avanzar mucho. ¿Qué famoso científico e inventor logró la primera transmisión de radio inalámbrica cruzando el Océano Atlántico en 1901?",
                opciones: [
                    { texto: "A) Alexander Graham Bell", correcta: false },
                    { texto: "B) Nikola Tesla", correcta: false },
                    { texto: "C) Guillermo Marconi", correcta: true }
                ],
                piropo: "Lo nuestro desafía cualquier ley de la física; tenemos la conexión inalámbrica más perfecta que existe. No importa el ruido del mundo, mi corazón funciona como un telégrafo que solo emite y recibe tu señal. Estamos tan sintonizadas que te siento acá conmigo en cada latido",
                pista: "Un abrazo voraz de chispas y humo ascendió hacia el cielo nocturno, devorando en pocas horas siglos de memoria y reflexiones que jamás volverían a repetirse."
            },
            {
                pregunta: "Albert Einstein presentó su Teoría de la Relatividad General en 1915, pero el mundo de la ciencia no le creyó del todo hasta que un evento astronómico real en 1919 demostró que el espacio y el tiempo se curvaban. ¿Qué evento fue?",
                opciones: [
                    { texto: "A) El paso del Cometa Halley cerca de la Tierra.", correcta: false },
                    { texto: "B) Un eclipse solar total fotografiado desde la isla de Príncipe.", correcta: true },
                    { texto: "C) Una lluvia de meteoritos inusualmente intensa en Europa.", correcta: false }
                ],
                piropo: "Einstein tenía razón con la Relatividad, cuando no estás, un minuto parece un siglo, pero hoy que cumplimos 8 meses juntas, el tiempo ha pasado como un paraneo, tan rápido porque a tu lado todo es increíble ",
                pista: "Su aliento se volvió ceniza y su eco se dispersó en el viento, dejando un vacío amargo que la historia aún lamenta como el día en que la luz del mundo perdió su mirada"
            }
        ];

        const apodosLindos = ["mi amor", "linda", "preciosa", "bombón", "tesoro", "corazón", "cielo", "duendecito", "calabacita"];
        let mesActual = 0;
        let etapaSobre = 0;
      function abrirTelon() {
            document.getElementById('telon').classList.add('abrir');
            setTimeout(() => { document.getElementById('telon').style.display = 'none'; }, 2000);
        }

        function irAPantalla(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
            if(id === 'pantalla-trivia') cargarPreguntaCompleta();
        }

        function cargarPreguntaCompleta() {
            const data = juegoDatos[mesActual];
            document.getElementById('txt-pregunta').innerText = data.pregunta;
            const container = document.getElementById('contenedor-opciones');
            container.innerHTML = '';

            data.opciones.forEach(opc => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcion';
                btn.innerText = opc.texto;
                btn.onclick = () => evaluarRespuestaTrivia(opc.correcta);
                container.appendChild(btn);
            });
        }

        function evaluarRespuestaTrivia(esCorrecta) {
            if(esCorrecta) {
                document.getElementById('txt-piropo').innerText = juegoDatos[mesActual].piropo;
                etapaSobre = 0;
                
                const pSobre = document.getElementById('pantalla-sobre');
                pSobre.classList.remove('sobre-abierto', 'deslizar-izquierda');
                pSobre.style.display = 'flex';
            } else {
                const apodo = apodosLindos[Math.floor(Math.random() * apodosLindos.length)];
                alert(`¡Cerca de la respuesta! Intenta de nuevo, ${apodo}. ¡Vos podés! 💕🔎`);
            }
        }

        function manejarClickSobre() {
            const pSobre = document.getElementById('pantalla-sobre');
            
            if(etapaSobre === 0) {
                pSobre.classList.add('sobre-abierto');
                etapaSobre = 1;
            } else if (etapaSobre === 1) {
                pSobre.classList.remove('sobre-abierto');
                etapaSobre = 2;
                
                setTimeout(() => {
                    pSobre.classList.add('deslizar-izquierda');
                    setTimeout(() => {
                        pSobre.style.display = 'none';
                        configurarPantallaPista();
                    }, 1000);
                }, 1000);
            }
        }

        function configurarPantallaPista() {
            document.getElementById('txt-desbloqueo-titulo').innerText = `Has desbloqueado pista ${mesActual + 1}`;
            const btnPista = document.getElementById('btn-pista-trigger');
            btnPista.innerText = `Pista ${mesActual + 1} 🔍`;
            btnPista.style.display = 'inline-block';
            
            document.getElementById('txt-maquina').innerText = '';
            document.getElementById('btn-continuar-pista').style.display = 'none';
            irAPantalla('pantalla-pista');
        }

        function iniciarEfectoEscritura() {
            document.getElementById('btn-pista-trigger').style.display = 'none';
            const textoCompleto = juegoDatos[mesActual].pista;
            const contenedor = document.getElementById('txt-maquina');
            contenedor.innerText = '';
            
            let i = 0;
            function escribir() {
                if(i < textoCompleto.length) {
                    contenedor.innerText += textoCompleto.charAt(i);
                    i++;
                    setTimeout(escribir, 35); 
                } else {
                    document.getElementById('btn-continuar-pista').style.display = 'inline-block';
                }
            }
            escribir();
        }

        function avanzarSiguienteMes() {
            if(mesActual < 7) {
                mesActual++;
                irAPantalla('pantalla-trivia');
            } else {
                irAPantalla('pantalla-cierre');
            }
        }
    </script>
</body>
</html>
